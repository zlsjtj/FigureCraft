<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="90mm" viewBox="0 0 160 90" role="img">
  <title>Dual-channel readout teaching DEMO</title>
  <desc>A single source S sends light rightwards through open shutter H to a tilted splitter B. One arrow turns upwards to reference detector R. A second continues through sample P to transmission detector T. Below this single layout, two horizontal acquisition rows show the same shutter closed with R0, T0 and open with R1, T1. The rows converge on a diamond testing ΔR &gt; 0, where ΔR = R1 − R0. Yes leads to q = (T1 − T0)/ΔR; No leads to INVALID. Each instrument component appears once in the main layout; only H is repeated in explicitly identified state views.</desc>
  <rect x="0" y="0" width="160" height="90" fill="#FFFFFF" stroke="none" stroke-width="0.3" id="figure-1" />
  <text x="5" y="7" font-family="Arial" font-size="3.5983333333333327" font-weight="bold" fill="#20353C" text-anchor="start" id="figure-2">One optical setup · H open</text>
  <text x="155" y="7" font-family="Arial" font-size="3.2102777777777773" font-weight="bold" fill="#53676D" text-anchor="end" id="figure-3">DEMO</text>
