<text id="t2" x="27" y="31" font-family="Arial" font-size="3.880555555555555" font-weight="bold" text-anchor="middle" fill="#213741">Group A</text>
<text id="t3" x="129" y="31" font-family="Arial" font-size="3.880555555555555" font-weight="bold" text-anchor="middle" fill="#213741">Group B</text>
<rect x="54" y="17" width="20" height="26" rx="0" fill="#E4F2EE" stroke="#B9C7CD" stroke-width="0.3"/>
<rect x="74" y="17" width="20" height="26" rx="0" fill="#F1F5F6" stroke="#B9C7CD" stroke-width="0.3"/>
<line x1="74" y1="17" x2="74" y2="43" stroke="#137C77" stroke-width="0.7"/>
<text id="t4" x="74" y="13" font-family="Arial" font-size="3.5277777777777772" font-weight="bold" text-anchor="middle" fill="#137C77">Face f</text>
<text id="t5" x="64" y="27" font-family="Arial" font-size="3.5277777777777772" font-weight="normal" text-anchor="middle" fill="#213741">Cell i</text>
<text id="t6" x="84" y="27" font-family="Arial" font-size="3.5277777777777772" font-weight="normal" text-anchor="middle" fill="#213741">Cell j</text>
<line x1="64" y1="44" x2="60" y2="65" stroke="#137C77" stroke-width="0.4" stroke-dasharray="1.2 1"/>
<line x1="84" y1="44" x2="88" y2="65" stroke="#137C77" stroke-width="0.4" stroke-dasharray="1.2 1"/>
<text id="t7" x="17" y="60" font-family="Arial" font-size="3.704166666666666" font-weight="bold" text-anchor="start" fill="#213741">A-owned cache</text>
