<text id="t8" x="31" y="75" font-family="Arial" font-size="3.880555555555555" font-weight="normal" text-anchor="middle" fill="#213741">Gf at r</text>
<text id="t9" x="59.5" y="75" font-family="Arial" font-size="3.880555555555555" font-weight="normal" text-anchor="middle" fill="#213741">Ti at r</text>
<text id="t10" x="88" y="75" font-family="Arial" font-size="3.880555555555555" font-weight="normal" text-anchor="middle" fill="#213741">Tj at r</text>
<text id="t11" x="59.5" y="88" font-family="Arial" font-size="3.5277777777777772" font-weight="bold" text-anchor="middle" fill="#213741">A reuses: r stays</text>
<line x1="134" y1="44" x2="134" y2="55" stroke="#B47B12" stroke-width="0.5"/>
<polygon points="134,55 134.8,53.2 133.2,53.2" fill="#B47B12" stroke="none" stroke-width="0.3"/>
<text id="t12" x="134" y="60" font-family="Arial" font-size="3.704166666666666" font-weight="bold" text-anchor="middle" fill="#213741">B-owned cache</text>
