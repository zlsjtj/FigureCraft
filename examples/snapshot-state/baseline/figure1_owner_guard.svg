<text id="t13" x="134.5" y="75" font-family="Arial" font-size="3.880555555555555" font-weight="normal" text-anchor="middle" fill="#213741">s → s + 1</text>
<text id="t14" x="134.5" y="88" font-family="Arial" font-size="3.5277777777777772" font-weight="bold" text-anchor="middle" fill="#213741">B refreshes</text>
