<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="104mm" viewBox="0 0 160 104">
<title>DEMO FICTION: owner-consistent heat-conductance reuse</title>
<desc>Constructed design and stipulated accounting; no solver was executed.</desc>
<rect x="0" y="0" width="160" height="104" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.28"/>
<text id="t0" x="3" y="6" font-family="Arial" font-size="3.880555555555555" font-weight="bold" text-anchor="start" fill="#213741">Keep a face with its owner&#x27;s snapshot</text>
<text id="t1" x="157" y="6" font-family="Arial" font-size="2.998611111111111" font-weight="normal" text-anchor="end" fill="#52636C">DEMO SCHEMATIC</text>
