<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="85.0mm" viewBox="0 0 1000 531.25"><defs /><title>Three isolated samples face one continuous reference cavity across closed diaphragms.</title><desc>Three isolated samples face one continuous reference cavity across closed diaphragms. DEMO. Three isolated sample chambers face the same connected reference cavity through closed diaphragms. The one-piece gasket seals three reference ports; two pins align the removable base while sample modules stay in place. Cutaway shapes and depths are illustrative, not mechanical dimensions or a pin-fit design. Depressurize before opening. The front wall is cut away to show the connected cavity; solid side walls remain opaque.</desc><metadata>{"figure_id": "pressure_fixture_assembled", "evidence_status": "DEMO_constructed_description_not_research", "semantic_digest": "4894ca90632fbd7a0764af32b0efc1d50d8b6b4749e23106af26fbb792b55280", "view": "normal"}</metadata><g id="canvas" data-entity="" data-role="" data-relation="" data-logical-id="" data-object-part=""><rect fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1" x="0" y="0" width="1000" height="531.25" rx="0" /></g><g id="title" data-entity="" data-role="" data-relation="" data-logical-id="" data-object-part=""><text fill="#243B47" stroke="none" stroke-width="1" opacity="1" font-size="26" text-anchor="start" xml:space="preserve"><tspan x="30.0" y="39.0" font-family="Arial">Three isolated samples, one reference</tspan></text></g><g id="demo" data-entity="" data-role="" data-relation="" data-logical-id="" data-object-part=""><text fill="#243B47" stroke="none" stroke-width="1" opacity="1" font-size="21" text-anchor="start" xml:space="preserve"><tspan x="906.0" y="38.0" font-family="Arial">DEMO</tspan></text></g><g id="base-top" data-entity="base" data-role="" data-relation="" data-logical-id="" data-object-part=""><path fill="#E5EBEE" stroke="#718792" stroke-width="1.7" opacity="1" d="M 118 348 L 173 314 L 873 314 L 