<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="76.90555555555555mm" viewBox="0 0 453.5433070866142 218"><text id="title" x="18" y="24" fill="#253B44" font-family="Arial" font-size="13" font-weight="bold">Three named layers</text><text id="demo" x="391" y="24" fill="#5A6D75" font-family="Arial" font-size="10.5" font-weight="normal">DEMO</text><polygon id="L1-side" points="380,53 386,48 386,80 380,85" fill="#C7AB77" stroke="none" /><polygon id="L1-top" points="78,53 84,48 386,48 380,53" fill="#C7AB77" stroke="none" /><rect id="L1-face" x="78" y="53" width="302" height="32" fill="#F5EBD5" stroke="none" /><text id="L1" x="26" y="75" fill="#253B44" font-family="Arial" font-size="11.25" font-weight="bold">L1</text><text id="L1-name" x="96" y="75" fill="#9C773F" font-family="Arial" font-size="11.25" font-weight="normal">Active layer</text><polygon id="L2-side" points="380,104 386,99 386,131 380,136" fill="#10272F" stroke="none" /><polygon id="L2-top" points="78,104 84,99 386,99 380,104" fill="#10272F" stroke="none" /><rect id="L2-face" x="78" y="104" width="302" height="32" fill="#253B44" stroke="none" /><text id="L2" x="26" y="126" fill="#253B44" font-family="Arial" font-size="11.25" font-weight="bold">L2</text><text id="L2-name" x="96" y="126" fill="#FFFFFF" font-family="Arial" font-size="11.25" font-weight="normal">Spacer</text><polygon id="L3-side" points="380,155 386,150 386,182 380,187" fill="#CBD2D6" stroke="none" /><polygon id="L3-top" points="78,155 84,150 386,150 380,155" fill="#CBD2D6" stroke="none" /><rect id="L3-face" x="78" y="155" width="302" height="32" fill="#EDF0F2" stroke="none" /><text id="L3" x="26" y="177" fill="#253B44" font-family="Arial" font-size="11.25" font-weight="bold">L3</text><text id="L3-name" x="96" y="177" fill="#929CA2" font-family="Arial" font-size="11.25" font-weight="normal">Carrier</text><text id="scope" x="18" y="210" fill="#5A6D75" font-family="Arial" font-size="10.5" font-weight="normal">Layer order only; dimensions are schematic</text><desc>DEMO. Three schematic plates are ordered L1, L2 and L3. Their names and order are the only content; plate dimensions and side depth are illustrative. The paired versions preserve geometry and labels. This is a typography and painted-background check, not a material or device performance result.</desc></svg>