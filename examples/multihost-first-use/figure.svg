<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="100.0mm" viewBox="0 0 800 500"><defs /><title>A and B read one immutable placement record and are resampled into separate mosaics.</title><desc>A and B read one immutable placement record and are resampled into separate mosaics. CONSTRUCTED DEMO. One T5 example is shown in two coordinate views. A selected translation of (84, 3) pixels is read by both channel resamplers (plain links); arrows denote application of that mapping, not physical motion. A local fiducial at (10, 18) maps to (94, 21) in each output. The planes have different stain intensities; only a representative paired fiducial is drawn. The record comes from A registration if its fixed score is at least 0.8, otherwise from stage metadata; B is not independently registered after fallback. Separate resampling also transforms the masks. Common placement does not correct residual channel-specific shifts or guarantee correct global placement. Frames show coordinate extents for this illustration, not a measured full mosaic boundary.</desc><metadata>{"figure_id": "paired_translation_first_use", "evidence_status": "DEMO_constructed_description_not_research", "semantic_digest": "fd3810373c8c95577d931903e48b85f0c8af3c00f3d2819a68db1f31a23932d7", "view": "normal"}</metadata><g id="canvas" data-entity="" data-role="" data-relation="" data-logical-id="" data-object-part=""><rect fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1" x="0" y="0" width="800" height="500" rx="0" /></g><g id="shared-B-line" data-entity="" data-role="relation" data-relation="shared-B" data-logical-id="" data-object-part=""><path fill="none" stroke="#778B99" stroke-width="1.6" opacity="1" d="M 344 294 L 344 368" /></g><g id="shared-A-line" data-entity="" data-role="relation" data-relation="shared-A" data-logical-id="" data-object-part=""><path fill="none" stroke="#778B99" stroke-width="1.6" opacity="1" d="M 344 230 L 344 160" /></g><g id="heading" data-entity="" data-role="" 