text><path id="leader-base" data-entity="annotation" d="M 78.00000 166.00000 L 132.00000 166.00000 L 181.00000 176.00000" fill="none" stroke="#7C8C92" stroke-width="0.58" stroke-linejoin="round"/><text id="label-post" x="329" y="105" font-family="Arial" font-size="10" font-weight="normal" text-anchor="start" fill="#283A42">Central post</text><path id="leader-post" data-entity="annotation" d="M 325.00000 101.00000 L 290.00000 101.00000 L 251.00000 110.00000" fill="none" stroke="#7C8C92" stroke-width="0.58" stroke-linejoin="round"/><text id="label-plate" x="329" y="222" font-family="Arial" font-size="10" font-weight="normal" text-anchor="start" fill="#283A42">Support plate</text><path id="leader-plate" data-entity="annotation" d="M 325.00000 218.00000 L 312.00000 218.00000 L 300.00000 186.00000" fill="none" stroke="#7C8C92" stroke-width="0.58" stroke-linejoin="round"/></svg>