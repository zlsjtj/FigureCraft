<text id="barrier-label" data-role="label" x="92" y="10" fill="#243340" font-family="Arial" font-size="3.5277777777777772" font-weight="normal" text-anchor="middle">Rigid barrier</text>
<text id="disk-B-label" data-role="label" x="74.77124344467705" y="47.2" fill="#243340" font-family="Arial" font-size="3.880555555555555" font-weight="bold" text-anchor="middle">B: d = 4</text>
<text id="disk-A-label" data-role="label" x="135" y="47.2" fill="#243340" font-family="Arial" font-size="3.5277777777777772" font-weight="bold" text-anchor="middle">A: d = 2</text>
<text id="opening-label" data-role="label" x="107" y="47.2" fill="#243340" font-family="Arial" font-size="3.880555555555555" font-weight="normal" text-anchor="middle">3</text>
<text id="B-outcome-label" data-role="label" x="74.77124344467705" y="71" fill="#243340" font-family="Arial" font-size="3.5277777777777772" font-weight="normal" text-anchor="middle">Too large: blocked</text>
