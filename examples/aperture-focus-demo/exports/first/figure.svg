<circle id="disk-B" data-entity="disk" data-object-part="primary" data-logical-id="B" data-role="disk_B" data-state="blocked_left" fill="#F3C3A0" stroke="#A64E24" stroke-width="0.65" cx="74.77124344467705" cy="46" r="20.0"/>
