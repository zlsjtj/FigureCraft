<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="100mm" viewBox="0 0 453.543307 283.464567">
<title>Housing-stopped sliding shoe, configuration D</title>
<desc>Two schematic orthogonal sections of the same retention hardware. Left: the engaged tooth and housing stop react outward pull. Right: upward sled travel retracts the shoe transversely after unloading. Preset demo fiction, not measurements.</desc>
