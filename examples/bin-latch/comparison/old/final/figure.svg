<text id="panel-a" x="12" y="43" font-family="Arial" font-size="10.5" font-weight="700" fill="#1F2933" text-anchor="start">a  Engaged: outward pull</text>
<text id="panel-b" x="240" y="43" font-family="Arial" font-size="10.5" font-weight="700" fill="#1F2933" text-anchor="start">b  Release: wall load &lt;2 N</text>
