<rect id="housing-a" data-role="housing" x="79" y="91" width="128" height="117" fill="#DCE2E6" stroke="#77838B" stroke-width="1.1"/>
<rect id="pocket-a" data-role="housing-pocket" x="103" y="107" width="89" height="88" fill="#FFFFFF" stroke="#77838B" stroke-width="0.8"/>
