<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="100.0mm" viewBox="0 0 900 562.5"><defs /><title>P bypasses the single holder before rinsing it; Q reverses the same two volumes.</title><desc>One hydraulic topology has separate Sample and Rinse reservoirs entering selector V1, then a pump and a feed segment labelled 2.0 mL nominal. Selector V2 routes liquid either through one holder or along a bypass. Both routes end at one Waste reservoir. A seat sensor is located at the holder inlet. Below, P reads 4.0 mL bypass, then 8.0 mL holder, then sample. Q reads 8.0 mL holder, then 4.0 mL bypass, and is labelled diagnostic control.</desc><metadata>{"figure_id": "collector_rinse_order_demo", "evidence_status": "Constructed DEMO; no physical experiments or mechanism validation", "semantic_digest": "10abdff8d81c3924f775ed4774bf4b8354013a4bc35a2622d8f2fdca11bbd50e", "view": "normal"}</metadata><g id="canvas" data-entity="" data-role="" data-relation="" data-logical-id="" data-object-part=""><rect fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1" x="0" y="0" width="900" height="562.5" rx="0" /></g><g id="demo" data-entity="" data-role="" data-relation="" data-logical-id="" data-object-part=""><text fill="#243741" stroke="none" stroke-width="1" opacity="1" font-size="18" text-anchor="start" xml:space="preserve"><tspan x="32.0" y="35.0" font-family="Arial">CONSTRUCTED DEMO</tspan></text></g><g id="topology-label" data-entity="" data-role="" data-relation="" data-logical-id="" data-object-part=""><text fill="#243741" stroke="none" stroke-width="1" opacity="1" font-size="23" text-anchor="start" xml:space="preserve"><tspan x="32.0" y="72.0" font-family="Arial">Liquid routes</tspan></text></g><g id="not-scale" data-entity="" data-role="" data-relation="" data-logical-id="" data-object-part=""><text fill="#243741" stroke="none" stroke-width="1" opacity="1" font-size="18" text-anchor="start" xml:space="preserve"><tspan x="754.9306640625" y="35.0" font-family="Arial"