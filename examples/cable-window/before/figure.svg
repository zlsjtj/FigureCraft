<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="67.55555555555556mm" viewBox="0 0 900 380"><defs /><title>Opening only the outer sheath reveals two intact individual insulation layers.</title><desc>A local opening in one common cable sheath reveals two parallel, smooth insulation surfaces. Copper is not exposed in the window. A separately identified end section of the same cable shows exactly two copper circles, each nested within its own insulation, together inside one sheath.</desc><metadata>{"figure_id": "two_core_cable_DEMO_before", "evidence_status": "Original constructed DEMO; no measured cable or experiment", "semantic_digest": "89dbff4c33636135fef23a42e0b51ee94cd0a79b5ac324803951243b8c879ea4", "view": "normal"}</metadata><g id="canvas" data-entity="" data-role="" data-relation="" data-logical-id="" data-object-part=""><rect fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1" x="0" y="0" width="900" height="380" rx="0" /></g><g id="title" data-entity="" data-role="" data-relation="" data-logical-id="" data-object-part=""><text fill="#23343D" stroke="none" stroke-width="1" opacity="1" font-size="22" text-anchor="start" xml:space="preserve"><tspan x="26.0" y="33.0" font-family="Arial">Two-core cable structure</tspan></text></g><g id="same-cable-sheath-section" data-entity="sheath" data-role="" data-relation="" data-logical-id="S" data-object-part="detail"><ellipse fill="#657985" stroke="#354148" stroke-width="1.6" opacity="1" cx="136" cy="151" rx="49" ry="83" /></g><g id="same-cable-interior-section" data-entity="sheath" data-role="" data-relation="" data-logical-id="S" data-object-part="detail"><ellipse fill="#FFFFFF" stroke="#354148" stroke-width="1" opacity="1" cx="136" cy="151" rx="40" ry="73" /></g><g id="same-cable-insulation-section-1" data-entity="insulation" data-role="" data-relation="" data-logical-id="I1" data-object-part="detail"><ellipse fill="#4FAEDE" stroke="#1E5672" stroke-width="1.3" opacity="1" cx="136" cy="119" rx="29" ry