<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="90mm" viewBox="0 0 453.54330709 255.11811024">
<title>Layered cable: stepped exposed end</title><desc>A single cable extends from the left and becomes successively narrower toward the right. A dark blue outer jacket surrounds a thin silver metal sleeve; the sleeve surrounds pale teal polymer insulation; the insulation surrounds the central copper conductor. Curved termination faces and contiguous surfaces show the three covering layers ending in that order, with a small copper tip last.</desc>
