<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="100mm" viewBox="0 0 160 100">
<title>Cross-lap members: complementary half-depth notches</title>
<desc>Constructed geometry demonstration. The same two members are shown separated, assembled, and in an enlarged section through the crossing. A occupies the lower half and B the upper half at the centre.</desc>
<rect x="0" y="0" width="160" height="100" fill="#FFFFFF"/>
<g id="heading-and-member-key">
<text x="8" y="8" font-family="Arial, sans-serif" font-size="4.0" fill="#24343B" text-anchor="start">Cross-lap: complementary half-depth notches</text>
<text x="152" y="8" font-family="Arial, sans-serif" font-size="2.8" fill="#52646B" text-anchor="end">DEMO</text>
<polygon points="8.0000,12.0000 11.0000,12.0000 11.0000,15.0000 8.0000,15.0000" fill="#62BDC0" stroke="#278C93" stroke-width="0.16" stroke-linejoin="round"/>
<text x="13" y="14.7" font-family="Arial, sans-serif" font-size="3.0" fill="#24343B" text-anchor="start">A   100 × 20 × 16 mm</text>
<polygon points="86.0000,12.0000 89.0000,12.0000 89.0000,15.0000 86.0000,15.0000" fill="#F0B971" stroke="#C77C38" stroke-width="0.16" stroke-linejoin="round"/>
<text x="91" y="14.7" font-family="Arial, sans-serif" font-size="3.0" fill="#24343B" text-anchor="start">B   80 × 20 × 16 mm</text>
<polyline points="8.0000,19.0000 152.0000,19.0000" fill="none" stroke="#D8E2E5" stroke-width="0.25" stroke-linejoin="round"/>
<text x="8" y="25" font-family="Arial, sans-serif" font-size="3.3" fill="#24343B" text-anchor="start">(a) Separated for explanation</text>
<text x="86" y="25" font-family="Arial, sans-serif" font-size="3.3" fill="#24343B" text-anchor="start">(b) Assembled</text>
</g>
